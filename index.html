<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="tak-labs のポータルページ。WebToolsをはじめとした各種コンテンツへのリンク集です。">
  <title>tak-labs</title>
  <style>
    :root {
      --color-bg: #ffffff;
      --color-bg-secondary: #f5f5f5;
      --color-text: #333333;
      --color-text-secondary: #666666;
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
      --color-border: #e0e0e0;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      --radius: 8px;
      --transition: 0.2s ease;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #1a1a1a;
        --color-bg-secondary: #2d2d2d;
        --color-text: #e0e0e0;
        --color-text-secondary: #a0a0a0;
        --color-primary: #3b82f6;
        --color-primary-hover: #60a5fa;
        --color-border: #404040;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      min-height: 100vh;
    }
    a { color: var(--color-primary); text-decoration: none; transition: color var(--transition); }
    a:hover { color: var(--color-primary-hover); }
    .container { max-width: 960px; margin: 0 auto; padding: 0 1rem; }
    .hero { padding: 4rem 0 2rem; text-align: center; }
    .hero__title { font-size: 2.25rem; font-weight: bold; margin-bottom: 0.5rem; }
    .hero__lead { color: var(--color-text-secondary); }
    .main { padding: 1rem 0 3rem; }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .card {
      display: block;
      background-color: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      transition: box-shadow var(--transition), transform var(--transition);
    }
    .card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
    .card__title { font-size: 1.25rem; margin-bottom: 0.5rem; color: var(--color-text); }
    .card__description { color: var(--color-text-secondary); font-size: 0.9rem; }
    .footer {
      background-color: var(--color-bg-secondary);
      border-top: 1px solid var(--color-border);
      padding: 1.5rem 0;
      color: var(--color-text-secondary);
      font-size: 0.875rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="container">
      <h1 class="hero__title">tak-labs</h1>
      <p class="hero__lead">各種コンテンツへのリンク集です。</p>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <div class="card-grid">
        <a href="/web-tools/" class="card">
          <h2 class="card__title">Web Tools</h2>
          <p class="card__description">JSONフォーマッター、Base64、QRコード生成など、無料で使えるオンラインツール集。</p>
        </a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">&copy; 2026 tak-labs. All rights reserved.</div>
  </footer>
</body>
</html>
